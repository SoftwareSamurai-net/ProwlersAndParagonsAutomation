<!DOCTYPE html>
<!-- data-mode is stamped here rather than only by the app, because the palette blocks in
     theme.css all name it and the app takes seconds to boot: without it the boot screen
     matches no palette block at all, so a reader who has chosen dark gets a light one until
     WebAssembly lands. Hero is the default identity; the layout replaces this from the
     character on the first render after one is restored. data-theme is *not* here — it is
     absent by design when nothing has been chosen, and js/theme.js stamps it if it has. -->
<html lang="en" data-mode="hero">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prowlers &amp; Paragons — Character Creation</title>
    <base href="/" />
    <!-- The owner's mark, as the HTML5 favicon pack it was generated as. Root-relative rather
         than relative to <base>, because site.webmanifest names its own two icons with absolute
         paths and one file addressing the same pack two ways is how a rename comes to break half
         of it. Every href here is asserted to exist on disk and to be served, because a <link>
         to a missing icon is the silent kind of broken: nothing errors, the browser simply falls
         back to its own glyph.

         No colour is named here and none may be. A theme-colour meta would be one, and it would
         also be a lie: this app has four palettes on two axes and a single tag can name one
         surface. The manifest carries theme_color/background_color instead — see the manifest
         note in docs/guide/browser.md for which colour and why. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- No scoped-CSS bundle is linked. Every component is written against the tokens in
         theme.css, which is what keeps the Hero/Villain switch to one attribute; a
         per-component stylesheet is where that discipline would start to leak. Blazor only
         emits the bundle when a .razor.css file exists, so linking it now would be a 404. -->
    <script type="importmap"></script>
    <!-- In <head>, and render-blocking, unlike every other script in this file. It stamps the
         chosen light/dark theme before the first paint; deferred to the foot of <body> like the
         others it would run after the boot screen had already been painted in the wrong one,
         and read from C# it would run seconds after that. See the file's own note. -->
    <script src="js/theme.js"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <p class="boot-title">Prowlers &amp; Paragons</p>
            <p class="boot-sub">Loading the rulebook…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/download.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/palette.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
