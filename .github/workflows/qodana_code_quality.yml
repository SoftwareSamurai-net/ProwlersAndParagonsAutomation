name: Qodana

# **It no longer runs on every pull request, and that is a deliberate trade.** Qodana was 39 of
# the last 100 runs, 214 of their 403 minutes, and **all 10 GB** of this repository's Actions
# cache — one ~420 MB entry per branch, against a 10 GB ceiling, so the caches were evicting each
# other and every run started cold.
#
# What makes the trade safe is that **the pull request was never where this check first ran**.
# `CLAUDE.md`'s own process requires `./scripts/qodana-scan.sh` locally, reading zero, before a
# pull request is opened — so the CI copy was re-proving a thing already proved, at five and a
# half minutes a push. What is kept is the part local runs cannot give: a scan of `main` as
# merged, which is a different claim from a scan of the branches that went into it.
#
# The weekly run is the backstop for the case the local step is skipped. If this starts finding
# things on `main` that the local scan should have caught, the answer is that the local step is
# not being run — not that this should go back on every push.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 07:00 UTC on Mondays. Nothing depends on the hour; it is off the top of the hour because
    # GitHub's scheduled runs queue heavily there.
    - cron: '13 7 * * 1'

# **Supersede a run rather than racing it.** A force-push to a pull request branch — a rebase, a
# fixup, a corrected commit message — used to leave the previous run burning to completion on a
# commit nobody would ever merge. Four of those in one session is most of an hour.
#
# Keyed on the workflow and the ref, so two different branches never cancel each other.
# `deploy.yml` deliberately does the opposite and should stay that way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for the action to upload SARIF results to GitHub code scanning.
  security-events: write
  # Required for the action to annotate pull requests.
  pull-requests: write
  checks: write
  # Required for the action to read its own workflow run. Without this it 403s
  # with "Resource not accessible by integration" and skips its status report.
  actions: read

jobs:
  qodana:
    name: Qodana Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Qodana needs the full history to compute the diff against the base branch.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          # No fail-threshold yet: the first runs establish what the codebase actually
          # reports. Once that is triaged, add `args: --baseline,qodana.sarif.json`
          # (committing the baseline) so only NEW problems fail the build.
          upload-result: true
      # **No QODANA_TOKEN here, deliberately, and do not put one back without a licence.**
      #
      # Passing a token makes Qodana link the Cloud project and then verify a licence — and
      # it does that for the *Community* linter too, which otherwise needs no account at
      # all. With a token and no licensed plan, both images die identically before
      # inspecting a single file:
      #
      #   ✓  Linked https://qodana.cloud project: ProwlersAndParagonsAutomation
      #   level=fatal msg="License request: token was declined by Qodana Cloud server"
      #
      # So a QODANA_TOKEN secret existing in the repository is enough to turn this workflow
      # red while analysing nothing, whatever qodana.yaml says. Not referencing the secret
      # is what makes that impossible: the scan cannot be broken by a credential it never
      # reads. Add it back only together with a Cloud plan that licenses the .NET linter,
      # and see the note in qodana.yaml for the rest of that change.

      # Code scanning needs GitHub Advanced Security on a private repository.
      # This repo is private, so the step is skipped rather than run-and-swallowed:
      # letting it fail left a red "Code scanning is not enabled" annotation on
      # every run, which trains you to ignore annotations. The scan itself still
      # runs above and `upload-result: true` publishes the report as an artifact.
      # This condition turns the upload on by itself if the repo becomes public.
      - name: Upload SARIF to GitHub code scanning
        if: always() && github.event.repository.visibility == 'public'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
