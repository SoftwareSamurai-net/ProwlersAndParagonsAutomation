name: Deploy

# Publishes the browser front end to Cloudflare Pages.
#
# Only ever from master, and never from `pull_request`. That is the security-relevant
# line in this file: a pull_request trigger runs the workflow with the base repository's
# secrets, so anyone who opened a PR could add a step that printed the Cloudflare token.
# push-to-master runs only code a maintainer has already merged.
on:
  push:
    branches:
      - master
    # Nothing outside these paths can change the published site, so a docs-only commit
    # does not spend a deploy.
    paths:
      - 'web/**'
      - 'engine/**'
      - 'sheets/**'
      - 'data/rules/**'
      # The accounts server, the book it serves, and the recorded conversations the replay
      # plays. `functions/` is the one file Cloudflare routes; `worker/` is everything it
      # imports, and both the rulebook corpus and the transcripts are bundled into it — so a
      # change to any of the four changes the deployed site even though none is under web/.
      # Editing data/rulebook/ or data/transcripts/ alone changes nothing here until the
      # corresponding bake script is re-run and worker/*-corpus.js is committed with it.
      - 'functions/**'
      - 'worker/**'
      - 'data/rulebook/**'
      - 'data/transcripts/**'
      - 'scripts/write-cloudflare-headers.sh'
      - 'Directory.Build.props'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Read-only. The job publishes to Cloudflare, not to this repository, so it needs no
# write access to anything here.
permissions:
  contents: read

# A newer commit supersedes an older deploy rather than racing it. Not cancelled
# in-flight: a half-uploaded site is worse than a briefly stale one.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish the static site
        run: |
          dotnet publish web/ProwlersAndParagons.Web.csproj \
            --configuration Release -p:ContinuousIntegrationBuild=true -o publish

      - name: Write security headers
        # The Content-Security-Policy hashes the inline import map Blazor emits into
        # index.html, which changes whenever the framework assets are re-fingerprinted.
        # The script fails rather than shipping a policy that would stop the app booting.
        run: ./scripts/write-cloudflare-headers.sh publish/wwwroot

      - name: Check the site is complete
        # A site that uploads cleanly and then cannot start is the failure worth catching
        # here: the rules are fetched at runtime, so their absence is invisible until a
        # visitor loads the page.
        run: |
          missing=0
          for f in data/rules/*.json; do
            name=$(basename "$f")
            if [ ! -s "publish/wwwroot/data/rules/$name" ]; then
              echo "::error::$name is missing or empty in the published site."
              missing=1
            fi
          done
          for required in index.html _headers _redirects; do
            if [ ! -s "publish/wwwroot/$required" ]; then
              echo "::error::$required is missing or empty in the published site."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check the accounts server is where wrangler will look for it
        # `wrangler pages deploy <dir>` bundles a `functions` directory found in the *working
        # directory*, not in the directory being uploaded — there is no flag for it, so the
        # placement is the configuration. A deploy from a directory without one succeeds,
        # uploads the site, and answers every /api/ address with the app's own index.html:
        # a site that works, signs nobody in, and says nothing about why.
        run: |
          set -euo pipefail

          [ -f functions/api/'[[path]]'.js ] || {
            echo "::error::functions/api/[[path]].js is missing, so this deploy would ship a"
            echo "::error::site with no accounts API. Every /api/ address would fall through"
            echo "::error::to _redirects and answer with index.html."
            exit 1
          }

          echo "Found the routed function; wrangler runs from $(pwd) and will bundle ./functions."

      - name: Ask Cloudflare which branch it treats as production
        # --branch is a label Cloudflare compares against the project's configured
        # production branch; it is not a branch it reads. If the two differ the deploy
        # lands as a preview — it succeeds, prints a <branch>.<project>.pages.dev alias,
        # and leaves the production URL and any custom domain on 404, saying nothing.
        #
        # Rather than require the project to be configured to match this repository (new
        # projects default to `main`, this repo is `master`), ask the project what it
        # calls production and use that. Then the two cannot disagree.
        id: production_branch
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prowlers-and-paragons' }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}"
          response=$(curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" "$api") || response=''

          branch=$(printf '%s' "$response" | jq -r '.result.production_branch // empty' 2>/dev/null || true)

          if [ -z "$branch" ]; then
            # Degrade to the repository's own branch rather than blocking the deploy: a
            # lookup hiccup should not stop a release, and the check after the deploy
            # still catches it if the guess is wrong.
            echo "::warning::Could not read the production branch from Cloudflare; falling back to 'master'."
            branch=master
          fi

          echo "Cloudflare treats '$branch' as production for project '$PROJECT'."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Refuse to deploy past a migration that has not been applied
        # **This exists because shipping code against a schema that was never migrated took the
        # site down, and every check in the project passed while it did.**
        #
        # `0005_campaigns.sql` added `characters.campaign_id`. The worker suite — 192 tests
        # against real SQLite — passed, because **it builds its schema by running the
        # migrations**, so it cannot notice that production's schema was never built. The deploy
        # ships the Worker and does not touch D1. So the code went live asking for a column that
        # existed only in a file, and `D1_ERROR: no such column: campaign_id` came back on
        # `/api/characters` — **breaking ordinary character saving for every signed-in reader**,
        # over a feature nobody was using yet. 29 failures before anybody looked.
        #
        # The smoke check further down did not catch it and could not: it asks `/api/me`, which
        # touches no table this migration changed. It proves the server is wired up, not that
        # its schema matches the code about to be deployed.
        #
        # **This refuses to deploy; it never applies anything.** Applying migrations from CI
        # would mean a bad migration ships itself, and the whole value of the manual step is that
        # a human is present for the one operation here that can destroy data. The failure mode
        # of forgetting is an outage; the failure mode of this step is a two-minute command,
        # which the error message names.
        #
        # **An unrecognised answer fails.** That is the load-bearing part rather than a nicety:
        # this parses wrangler's prose, so a reworded release must not read as "all clear" —
        # which is the exact shape of guard failure `CLAUDE.md` records four times over, a check
        # satisfied by there being nothing to check. Only the explicit all-clear passes.
        #
        # **Pinned to a version whose output was read, not guessed.** `wrangler@3.90.0` — the
        # version deploy uses to *bundle* — answers this command with a usage dump rather than a
        # result, which would have been an unrecognised answer every run. This step simulates
        # nothing, so it does not need the deploy's version; it needs one whose two answers have
        # been seen. 4.127.0 prints `Migrations to be applied:` with a table, or
        # `No migrations to apply!`, both verified against the real database before this landed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          answer=$(npx --yes wrangler@4.127.0 --cwd d1 \
            d1 migrations list prowlers-and-paragons --remote 2>&1) || true

          echo "$answer"

          if printf '%s' "$answer" | grep -q 'No migrations to apply'; then
            echo "Every migration in d1/migrations is applied to the remote database."
            exit 0
          fi

          if printf '%s' "$answer" | grep -q 'Migrations to be applied'; then
            echo "::error::A migration in d1/migrations has not been applied to the remote"
            echo "::error::database, and the code about to deploy may depend on it. Apply it"
            echo "::error::first, then re-run this deploy:"
            echo "::error::  npx wrangler --cwd d1 d1 migrations apply prowlers-and-paragons --remote"
            exit 1
          fi

          echo "::error::Could not tell whether migrations are pending — wrangler answered with"
          echo "::error::neither of the two forms this step knows. Refusing to deploy rather than"
          echo "::error::assuming the database is up to date. Read the output above; if wrangler"
          echo "::error::has reworded its answer, update this step to match what it says now."
          exit 1

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3   # wrangler=3.90.0 — the CI dry-run reads this line
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy publish/wwwroot
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prowlers-and-paragons' }}
            --branch=${{ steps.production_branch.outputs.branch }}

      - name: Confirm the production URL is live
        # The deploy step passes whether or not the deployment became production, so
        # without this the branch mismatch above is silent. Checks the production
        # hostname specifically, not the per-deploy alias.
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prowlers-and-paragons' }}
          DEPLOYED_BRANCH: ${{ steps.production_branch.outputs.branch }}
        run: |
          url="https://${PROJECT}.pages.dev/"
          # Cloudflare needs a moment to route a fresh production deployment.
          for attempt in 1 2 3 4 5; do
            # Assign, then replace on failure. `$(curl ... || echo 000)` would concatenate
            # curl's own output with the fallback and produce things like "200000".
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url") || code=000
            [ "$code" = "200" ] && { echo "$url is live."; exit 0; }
            echo "Attempt $attempt: $url returned $code"
            sleep 10
          done
          echo "::error::$url returned $code, so this deploy did not become production."
          echo "::error::The deploy used branch '${DEPLOYED_BRANCH}', read from the Pages"
          echo "::error::project itself, so a branch mismatch is unlikely — check the"
          echo "::error::project name in the CLOUDFLARE_PAGES_PROJECT variable, and that"
          echo "::error::the API token can read the project (Cloudflare Pages: Edit)."
          exit 1

      - name: Confirm the accounts API answers
        # **The only moment this failure is observable.** A Pages deploy whose functions were
        # not bundled, or whose D1 binding is not configured, serves the site perfectly: every
        # /api/ address falls through to _redirects and answers index.html with a 200. The app
        # then starts, works, and signs nobody in for ever — because its client reads an
        # unparseable answer as "anonymous", deliberately, so that a missing server is a missing
        # feature rather than a blank page. Nothing else would ever report it.
        #
        # So the check is on the *shape* of the answer, not on the status alone: 401 carrying
        # JSON is a working server saying nobody is signed in, which is exactly right here.
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prowlers-and-paragons' }}
        run: |
          set -uo pipefail

          url="https://${PROJECT}.pages.dev/api/me"

          # Assign, then replace on failure. `$(curl ... || echo)` concatenates curl's own
          # output with the fallback, which is how "200000" gets reported as a status.
          answer=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$url") || answer='000 none'
          status=${answer%% *}
          type=${answer#* }

          echo "$url -> $status ($type)"

          case "$type" in
            application/json*) ;;
            *)
              echo "::error::/api/me answered with '$type' rather than JSON, so the accounts API"
              echo "::error::is not deployed: Pages served the app's own index.html through"
              echo "::error::_redirects instead. Check that functions/ was bundled and that the"
              echo "::error::Pages project has a D1 binding named DB — docs/ACCOUNTS-SETUP.md."
              exit 1
              ;;
          esac

          if [ "$status" != "401" ]; then
            echo "::error::/api/me answered $status. With nobody signed in it must answer 401;"
            echo "::error::anything else means the session check is not doing what it claims."
            exit 1
          fi

          echo "The accounts API is answering."
