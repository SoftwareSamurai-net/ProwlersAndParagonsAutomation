name: Deploy

# Publishes the browser front end to Cloudflare Pages.
#
# Only ever from master, and never from `pull_request`. That is the security-relevant
# line in this file: a pull_request trigger runs the workflow with the base repository's
# secrets, so anyone who opened a PR could add a step that printed the Cloudflare token.
# push-to-master runs only code a maintainer has already merged.
on:
  push:
    branches:
      - master
    # Nothing outside these paths can change the published site, so a docs-only commit
    # does not spend a deploy.
    paths:
      - 'web/**'
      - 'engine/**'
      - 'sheets/**'
      - 'data/rules/**'
      - 'scripts/write-cloudflare-headers.sh'
      - 'Directory.Build.props'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Read-only. The job publishes to Cloudflare, not to this repository, so it needs no
# write access to anything here.
permissions:
  contents: read

# A newer commit supersedes an older deploy rather than racing it. Not cancelled
# in-flight: a half-uploaded site is worse than a briefly stale one.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish the static site
        run: |
          dotnet publish web/ProwlersAndParagons.Web.csproj \
            --configuration Release -p:ContinuousIntegrationBuild=true -o publish

      - name: Write security headers
        # The Content-Security-Policy hashes the inline import map Blazor emits into
        # index.html, which changes whenever the framework assets are re-fingerprinted.
        # The script fails rather than shipping a policy that would stop the app booting.
        run: ./scripts/write-cloudflare-headers.sh publish/wwwroot

      - name: Check the site is complete
        # A site that uploads cleanly and then cannot start is the failure worth catching
        # here: the rules are fetched at runtime, so their absence is invisible until a
        # visitor loads the page.
        run: |
          missing=0
          for f in data/rules/*.json; do
            name=$(basename "$f")
            if [ ! -s "publish/wwwroot/data/rules/$name" ]; then
              echo "::error::$name is missing or empty in the published site."
              missing=1
            fi
          done
          for required in index.html _headers _redirects; do
            if [ ! -s "publish/wwwroot/$required" ]; then
              echo "::error::$required is missing or empty in the published site."
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to Cloudflare Pages
        # --branch is a label Cloudflare compares against the project's configured
        # production branch, not a branch it reads. They must match or the deploy lands
        # as a preview: it succeeds, reports a master.<project>.pages.dev alias, and
        # leaves the production URL and the custom domain on 404. Cloudflare defaults new
        # projects to `main`, so this one needs setting to `master` — see the README.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy publish/wwwroot
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prowlers-and-paragons' }}
            --branch=master

      - name: Confirm the production URL is live
        # The deploy step passes whether or not the deployment became production, so
        # without this the branch mismatch above is silent. Checks the production
        # hostname specifically, not the per-deploy alias.
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prowlers-and-paragons' }}
        run: |
          url="https://${PROJECT}.pages.dev/"
          # Cloudflare needs a moment to route a fresh production deployment.
          for attempt in 1 2 3 4 5; do
            # Assign, then replace on failure. `$(curl ... || echo 000)` would concatenate
            # curl's own output with the fallback and produce things like "200000".
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url") || code=000
            [ "$code" = "200" ] && { echo "$url is live."; exit 0; }
            echo "Attempt $attempt: $url returned $code"
            sleep 10
          done
          echo "::error::$url returned $code, so this deploy did not become production."
          echo "::error::Set the Pages project's production branch to 'master' (Settings"
          echo "::error::-> Builds & deployments). Cloudflare defaults it to 'main', which"
          echo "::error::makes every deploy a preview."
          exit 1
