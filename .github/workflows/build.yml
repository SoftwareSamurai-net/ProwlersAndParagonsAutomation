name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build (net10.0)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Refuse to ship the rulebook
        # The rulebook is copyright LakeSide Games. This tool distributes structured
        # rules metadata only, so a tracked PDF is a licensing problem, not a style one.
        run: |
          tracked=$(git ls-files '*.pdf')
          if [ -n "$tracked" ]; then
            echo "::error::PDF files are tracked in this repository:"
            echo "$tracked"
            echo "The rulebook must not be redistributed. Remove it with 'git rm --cached'."
            exit 1
          fi
          echo "No PDFs tracked."

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Honours the SDK version pinned in global.json.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # ContinuousIntegrationBuild=true turns analyzer warnings into errors
        # (see ProwlersAndParagonsAutomation.csproj).
        run: dotnet build --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test
        # The suite checks powers.json against the Range/Rank/Cost transcribed from the
        # rulebook, so a data edit that contradicts the book fails here.
        run: dotnet test --no-build --configuration Release -p:ContinuousIntegrationBuild=true


      - name: Set up Node
        # Pinned rather than taken from the runner image: the accounts tests need `node:sqlite`
        # and JSON import attributes, both of which are Node 22. A runner that happened to ship
        # an older one would fail in a way that looks like a broken test.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the accounts API
        # The accounts server is JavaScript, because Cloudflare Workers is — so it is invisible
        # to `dotnet test` and needs its own step. It runs the real migration against real
        # SQLite through `node:sqlite`, which is why the floor is Node 22.
        #
        # **Assert the count, not the exit code.** `node --test` with a glob that matches
        # nothing exits 0 and reports zero tests, which reads exactly like a suite that passed.
        run: |
          set -euo pipefail

          node --version
          node --test "tests/worker/*.test.mjs" | tee /tmp/worker.tap

          passed=$(grep -c '^ok ' /tmp/worker.tap || true)
          echo "The accounts API's suite reported $passed passing tests."

          if [ "${passed:-0}" -lt 30 ]; then
            echo "::error::only $passed accounts tests ran; the glob has stopped matching."
            exit 1
          fi

      - name: Drive the proof harnesses in a browser
        # **The only guards here that a source scan cannot fake.**
        #
        # Two guards in WebPresentationTests assert that motion.js *mentions* still() and
        # setTimeout. Both pass against a script doing the opposite of what it says:
        # `|| !still()) return` is one character and serves the animation to exactly the
        # people who asked for none, and `setTimeout(() => {}, 1000)` is a failsafe that
        # catches nothing. The property is behavioural, so the instrument has to run the code.
        #
        # ubuntu-latest ships Chrome, so this costs a step rather than a dependency.
        #
        # **Assert on the positive.** A harness whose script never ran leaves its resting text
        # in place, which is neither verdict — so grepping for FAIL and finding none would call
        # a broken harness green. Each page must *say* PASS.
        run: |
          set -euo pipefail

          PP_PROOF=1 dotnet test tests/ProwlersAndParagons.Web.Tests \
            --no-build --configuration Release

          chrome="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "Driving with $chrome"

          root="$(pwd)/web/wwwroot"
          failed=0

          # page:expected-verdict:extra-chrome-flags
          checks="
          proof-sticky.html:STICKY: PASS:
          proof-narrow.html:NARROW: PASS:
          proof-narrow-shell.html:NARROW: PASS:
          proof-measure.html:INSETS: PASS:
          proof-motion.html:MOTION: PASS:
          proof-motion.html:MOTION: PASS:--force-prefers-reduced-motion
          proof-shortcut.html:SHORTCUT: PASS:
          "

          while IFS= read -r line; do
            [ -z "$(echo "$line" | tr -d '[:space:]')" ] && continue
            page="${line%%:*}"; page="${page//[[:space:]]/}"
            rest="${line#*:}"
            want="${rest%:*}"; want="${want#"${want%%[![:space:]]*}"}"
            flags="${rest##*:}"; flags="${flags//[[:space:]]/}"

            dump="$(mktemp)"
            "$chrome" --headless=new --no-sandbox --disable-gpu \
              --allow-file-access-from-files --user-data-dir="$(mktemp -d)" \
              --virtual-time-budget=8000 $flags \
              --dump-dom "file://$root/$page" > "$dump" 2>/dev/null || true

            # The <title> and not the body: both verdict strings appear in each harness's own
            # script source, so a whole-document grep is satisfied by a page that never ran.
            if grep -q "<title>$want" "$dump"; then
              echo "  ok    $page ${flags:+($flags) }-> $want"
            else
              got="$(grep -o '<title>[^<]*' "$dump" | head -1 | sed 's|<title>||')"
              echo "::error::$page ${flags:+($flags) }expected '$want', title was '${got:-<none>}'"
              sed -n '/id="verdict"/,/<\/div>/p' "$dump" | head -12
              failed=1
            fi
          done <<< "$checks"

          exit "$failed"
      - name: Publish the browser front end
        # The static site is the deliverable for web/, and publishing exercises things a
        # plain build does not — chiefly staging data/rules into wwwroot.
        run: |
          dotnet publish web/ProwlersAndParagons.Web.csproj \
            --configuration Release -p:ContinuousIntegrationBuild=true -o publish

      - name: Write security headers
        # Run here as well as on deploy so a change that breaks the Content-Security-Policy
        # fails on the pull request rather than on the way to production. The script exits
        # non-zero if it cannot find the inline import map to hash.
        run: ./scripts/write-cloudflare-headers.sh publish/wwwroot

      - name: Check the published site is complete
        # Nothing else checks the served payload. The rules are fetched at runtime, so
        # their absence is a site that loads and then cannot start — invisible to a build.
        run: |
          missing=0
          for f in data/rules/*.json; do
            name=$(basename "$f")
            if [ ! -s "publish/wwwroot/data/rules/$name" ]; then
              echo "::error::$name is missing or empty in the published site."
              missing=1
            fi
          done
          for required in index.html _headers _redirects; do
            if [ ! -s "publish/wwwroot/$required" ]; then
              echo "::error::$required is missing or empty in the published site."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "Published site is complete."
          exit "$missing"
