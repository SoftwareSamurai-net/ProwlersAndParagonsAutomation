name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build (net10.0)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Honours the SDK version pinned in global.json.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # ContinuousIntegrationBuild=true turns analyzer warnings into errors
        # (see ProwlersAndParagonsAutomation.csproj).
        run: dotnet build --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
