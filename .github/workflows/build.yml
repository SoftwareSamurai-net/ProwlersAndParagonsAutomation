name: Build

on:
  workflow_dispatch:
  pull_request:
    # **One file now, and it used to be two.** Almost every Markdown file in this repository is
    # read by a test — `CLAUDE.md` and `docs/guide/*.md` by `RepositoryGuideTests`,
    # `docs/ACCOUNTS-SETUP.md` by `AccountsContractTests`, `docs/MCP-SETUP.md` and `README.md` by
    # `McpSetupDocumentationTests`, `mcp/QUESTION-POLICY.md` by `McpQuestionPolicyTests` — so
    # "it is only docs" is false here far more often than it looks. Editing the index past its
    # line budget, or adding a guide the routing table does not name, is a red build.
    #
    # **`PROGRESS.md` came off this list when it stopped being unread.** `ProgressArchiveTests`
    # opens it now, to hold the completed-work section to being a pointer rather than a place
    # entries accumulate — which is what the shared anchor between every two concurrent branches
    # used to be. A skipped path whose contents a test checks is a change that merges without the
    # build that would have caught it, and `WorkflowFilterTests` says so by name.
    #
    # The file it left behind is 85% smaller for the same reason, so what a build now runs over is
    # open work and a state table rather than six thousand lines of archive.
    paths-ignore:
      - 'docs/HANDOVER.md'
  push:
    branches:
      - main
    # **One file now, and it used to be two.** Almost every Markdown file in this repository is
    # read by a test — `CLAUDE.md` and `docs/guide/*.md` by `RepositoryGuideTests`,
    # `docs/ACCOUNTS-SETUP.md` by `AccountsContractTests`, `docs/MCP-SETUP.md` and `README.md` by
    # `McpSetupDocumentationTests`, `mcp/QUESTION-POLICY.md` by `McpQuestionPolicyTests` — so
    # "it is only docs" is false here far more often than it looks. Editing the index past its
    # line budget, or adding a guide the routing table does not name, is a red build.
    #
    # **`PROGRESS.md` came off this list when it stopped being unread.** `ProgressArchiveTests`
    # opens it now, to hold the completed-work section to being a pointer rather than a place
    # entries accumulate — which is what the shared anchor between every two concurrent branches
    # used to be. A skipped path whose contents a test checks is a change that merges without the
    # build that would have caught it, and `WorkflowFilterTests` says so by name.
    #
    # The file it left behind is 85% smaller for the same reason, so what a build now runs over is
    # open work and a state table rather than six thousand lines of archive.
    paths-ignore:
      - 'docs/HANDOVER.md'

# **Supersede a run rather than racing it.** A force-push to a pull request branch — a rebase, a
# fixup, a corrected commit message — used to leave the previous run burning to completion on a
# commit nobody would ever merge. Four of those in one session is most of an hour.
#
# Keyed on the workflow and the ref, so two different branches never cancel each other.
# `deploy.yml` deliberately does the opposite (`cancel-in-progress: false`) and should stay that
# way: cancelling a half-finished deploy is how a site ends up serving a partial upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (net10.0)
    runs-on: ubuntu-latest

    # **A hung step ran to GitHub's six-hour ceiling and spent six hours of the organisation's
    # Actions allowance saying nothing.** The visual comparator printed `pixel-identical` for six
    # of seven proof pages and then produced no line at all for the seventh, and sat there until
    # the platform killed it. A re-run over byte-identical inputs passed, so it was not a
    # deterministic fault in the page or the golden.
    #
    # **The cause is worth finding and the cap is worth having either way**, which is why this is
    # here rather than only a fix to the comparator: the default is *no* limit, so any hang
    # anywhere in this job — Chrome not exiting, a `dotnet test` deadlock, a runner stalling on
    # IO — costs six hours before anybody is told. This job takes four to six minutes; thirty is
    # generous enough that a slow runner is never killed by it and short enough that a hang is a
    # fast, legible failure instead of an invoice.
    #
    # It is deliberately on the job and not on one step. Capping only the step that hung would be
    # fixing the instance rather than the class, and the next hang would be somewhere else.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Refuse to ship the rulebook
        # The rulebook is copyright LakeSide Games. This tool distributes structured
        # rules metadata only, so a tracked PDF is a licensing problem, not a style one.
        run: |
          tracked=$(git ls-files '*.pdf')
          if [ -n "$tracked" ]; then
            echo "::error::PDF files are tracked in this repository:"
            echo "$tracked"
            echo "The rulebook must not be redistributed. Remove it with 'git rm --cached'."
            exit 1
          fi
          echo "No PDFs tracked."

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Honours the SDK version pinned in global.json.
          global-json-file: global.json

      - name: Restore
        # **A `~/.nuget/packages` cache stood here for one day and was deleted on measurement.**
        # It was added on the reasonable-sounding ground that a run should not re-resolve the same
        # graph every time — and then two runs that *hit* the cache restored in 11s and 15s, which
        # is what this step already did on `main` with no cache at all. Counting the cache step's
        # own cost (5s to pull 190 MB, plus its post step) it was **16-21 seconds against 11**: a
        # net loss in its best case, since a hit is as good as a cache gets.
        #
        # **The wrangler cache below was added in the same change and is kept**, because the same
        # arithmetic says the opposite there: 4s to restore, replacing a 12s registry fetch. Two
        # caches, one measurement each, two different answers — which is the reason to measure a
        # cache rather than assume one.
        #
        # See docs/progress/2026-09-02-the-caches-second-run.md. Do not re-add this without a run
        # that shows Restore beating 11 seconds.
        run: dotnet restore

      - name: Build
        # ContinuousIntegrationBuild=true turns analyzer warnings into errors
        # (see ProwlersAndParagonsAutomation.csproj).
        run: dotnet build --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test
        # The suite checks powers.json against the Range/Rank/Cost transcribed from the
        # rulebook, so a data edit that contradicts the book fails here.
        #
        # **`PP_PROOF` is set here because the browser step below used to run this suite a
        # second time to get it.** `ProofPages` writes the proof harnesses only when that
        # variable is set and is otherwise inert — the *writing* is what is conditional, not
        # the tests, so both runs executed the identical 782 assertions and the second one
        # existed purely to leave files in `web/wwwroot`. That was 782 tests and about sixteen
        # seconds spent proving a thing already proved eleven seconds earlier in the same job.
        #
        # Nothing is skipped by this: the suite is the same suite, and it now leaves the proof
        # pages behind for the browser step and the pixel comparison that follow it. The step
        # ordering is what makes that safe, and it is the only thing that does — a step that
        # reads `web/wwwroot/proof-*.html` must come after this one.
        env:
          PP_PROOF: "1"
        run: dotnet test --no-build --configuration Release -p:ContinuousIntegrationBuild=true


      - name: Set up Node
        # Pinned rather than taken from the runner image: the accounts tests need `node:sqlite`
        # and JSON import attributes, both of which are Node 22. A runner that happened to ship
        # an older one would fail in a way that looks like a broken test.
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test the accounts API
        # The accounts server is JavaScript, because Cloudflare Workers is — so it is invisible
        # to `dotnet test` and needs its own step. It runs the real migration against real
        # SQLite through `node:sqlite`, which is why the floor is Node 22.
        #
        # **Assert the count, not the exit code.** `node --test` with a glob that matches
        # nothing exits 0 and reports zero tests, which reads exactly like a suite that passed.
        #
        # **`--test-reporter=tap` is explicit rather than assumed**, the same as the comparator
        # step below. The grep on `^ok ` relies on Node choosing the tap reporter because stdout
        # is a pipe, and that default has already stopped holding once — Node 24 prints a `spec`
        # reporter's `✔ name (123ms)` lines, which this grep matches zero times however many
        # tests passed. The pin above keeps CI on 22 today, so this changes nothing now (measured
        # in `node:22-alpine`: the flag is accepted and the `ok ` lines are identical); what it
        # buys is that raising that pin cannot turn a green suite into "the glob has stopped
        # matching".
        run: |
          set -euo pipefail

          node --version
          node --test --test-reporter=tap "tests/worker/*.test.mjs" | tee /tmp/worker.tap

          passed=$(grep -c '^ok ' /tmp/worker.tap || true)
          echo "The accounts API's suite reported $passed passing tests."

          if [ "${passed:-0}" -lt 30 ]; then
            echo "::error::only $passed accounts tests ran; the glob has stopped matching."
            exit 1
          fi

      - name: Test the D1 migration gate
        # scripts/d1-migrations/gate.mjs is the pure decision behind scripts/apply-migrations.sh
        # — the step deploy.yml runs before every Pages upload to apply pending D1 migrations and
        # abort the deploy if that is not safe. It touches no network and no filesystem of its
        # own, so this needs nothing beyond `node --test`; also runnable locally via
        # scripts/test-deploy-gate.sh.
        #
        # **Assert the count, not the exit code**, same trap as the accounts API step above.
        # **`--test-reporter=tap` is explicit, not assumed**, for the same measured reason.
        run: |
          set -euo pipefail

          node --version
          node --test --test-reporter=tap "tests/deploy/*.test.mjs" | tee /tmp/deploy-gate.tap

          passed=$(grep -c '^ok ' /tmp/deploy-gate.tap || true)
          echo "The D1 migration gate's suite reported $passed passing tests."

          if [ "${passed:-0}" -lt 10 ]; then
            echo "::error::only $passed deploy-gate tests ran; the glob has stopped matching."
            exit 1
          fi

      - name: Test the visual-regression comparator
        # scripts/visual/diff.mjs is the pixel-comparator behind the visual-regression check
        # below, and scripts/visual/png.mjs is the hand-written PNG codec it depends on — neither
        # had a test until an adversarial audit found the comparator's tolerance had two
        # independent holes (see scripts/visual/diff.mjs's own header comment and
        # docs/notes/s9-diffguard.md). Also runnable locally via scripts/test-visual.sh.
        #
        # **Assert the count, not the exit code**, same trap as the accounts API step above.
        # **`--test-reporter=tap` is explicit, not assumed** — measured on this repository's own
        # tooling, Node's "tap when stdout is not a TTY" default did not hold (a `spec` reporter's
        # `✔ name (123ms)` lines match this grep zero times regardless of how many tests passed),
        # so this does not repeat that assumption for CI.
        run: |
          set -euo pipefail

          node --version
          node --test --test-reporter=tap "tests/visual/*.test.mjs" | tee /tmp/visual-unit.tap

          passed=$(grep -c '^ok ' /tmp/visual-unit.tap || true)
          echo "The visual-regression comparator's suite reported $passed passing tests."

          if [ "${passed:-0}" -lt 10 ]; then
            echo "::error::only $passed visual-regression comparator tests ran; the glob has stopped matching."
            exit 1
          fi

      - name: Drive the proof harnesses in a browser
        # **The only guards here that a source scan cannot fake.**
        #
        # Two guards in WebPresentationTests assert that motion.js *mentions* still() and
        # setTimeout. Both pass against a script doing the opposite of what it says:
        # `|| !still()) return` is one character and serves the animation to exactly the
        # people who asked for none, and `setTimeout(() => {}, 1000)` is a failsafe that
        # catches nothing. The property is behavioural, so the instrument has to run the code.
        #
        # ubuntu-latest ships Chrome, so this costs a step rather than a dependency.
        #
        # **Assert on the positive.** A harness whose script never ran leaves its resting text
        # in place, which is neither verdict — so grepping for FAIL and finding none would call
        # a broken harness green. Each page must *say* PASS.
        #
        # **A verdict is not proof the harness can fail, and one was hard-coded past
        # `ProofPages.MustNotShow` to check.** `|| true` appended to the sticky
        # harness's verdict, and to the motion harness's `checks.every(...)`, reported PASS
        # against a genuinely broken sticky strip and against the exact reduced-motion
        # inversion the motion harness exists to catch — `MustNotShow` stayed green throughout,
        # because `|| true` is not the banned literal `say(true`. See docs/notes/s4-harness.md.
        # So every harness below that can be given an honest negative control is: alongside the
        # real page, ProofPages.cs also writes a *twin* that reproduces one documented defect —
        # the same harness script, driving a shell or a shipped file with that one defect
        # injected — and this step requires the real page to say PASS **and its twin to say
        # FAIL**, in the same run. A harness reporting PASS on both proves nothing about the
        # thing it claims to measure, and that is now a failure here rather than a silence.
        #
        # **The pages are written by the Test step above, not here.** This step used to re-run
        # the whole 782-test bUnit suite under `PP_PROOF=1` to get them; that variable now sits
        # on the Test step, which runs the same assertions either way. See its comment.
        run: |
          set -euo pipefail

          chrome="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "Driving with $chrome"

          root="$(pwd)/web/wwwroot"

          # page:expected-verdict:extra-chrome-flags
          checks="
          proof-sticky.html:STICKY: PASS:
          proof-sticky-broken.html:STICKY: FAIL:
          proof-narrow.html:NARROW: PASS:
          proof-narrow-shell.html:NARROW: PASS:
          proof-narrow-front.html:NARROW: PASS:
          proof-narrow-rules.html:NARROW: PASS:
          proof-narrow-broken.html:NARROW: FAIL:
          proof-measure.html:INSETS: PASS:
          proof-measure-broken.html:INSETS: FAIL:
          proof-align.html:ALIGN: PASS:
          proof-align-broken.html:ALIGN: FAIL:
          proof-motion.html:MOTION: PASS:
          proof-motion.html:MOTION: PASS:--force-prefers-reduced-motion
          proof-motion-broken.html:MOTION: FAIL:
          proof-motion-broken.html:MOTION: FAIL:--force-prefers-reduced-motion
          proof-shortcut.html:SHORTCUT: PASS:
          proof-shortcut-broken.html:SHORTCUT: FAIL:
          proof-theme.html:THEME: PASS:
          proof-theme-broken.html:THEME: FAIL:
          proof-slider.html:SLIDER: PASS:
          proof-slider-broken.html:SLIDER: FAIL:
          "

          # One line of the list above, driven in its own Chrome. Exported so `xargs` below can
          # call it, which is the whole reason this is a function rather than a loop body: the
          # twenty-one launches used to run strictly one after another and each costs about a
          # second, on a runner with four cores doing nothing. Four at a time also overlaps the
          # first launch, which is cold and takes seventeen seconds by itself while the rest
          # take one.
          #
          # **Every line this prints is emitted in a single `echo`.** Four Chromes reporting
          # concurrently will interleave otherwise, and a failure whose `::error::` line lands
          # between another page's output is a failure somebody scrolls past.
          drive() {
            line="$1"
            page="${line%%:*}"; page="${page//[[:space:]]/}"
            rest="${line#*:}"
            want="${rest%:*}"; want="${want#"${want%%[![:space:]]*}"}"
            flags="${rest##*:}"; flags="${flags//[[:space:]]/}"

            dump="$(mktemp)"
            "$chrome" --headless=new --no-sandbox --disable-gpu \
              --allow-file-access-from-files --user-data-dir="$(mktemp -d)" \
              --virtual-time-budget=8000 $flags \
              --dump-dom "file://$root/$page" > "$dump" 2>/dev/null || true

            # The <title> and not the body: both verdict strings appear in each harness's own
            # script source, so a whole-document grep is satisfied by a page that never ran.
            if grep -q "<title>$want" "$dump"; then
              echo "  ok    $page ${flags:+($flags) }-> $want"
            else
              got="$(grep -o '<title>[^<]*' "$dump" | head -1 | sed 's|<title>||')"
              detail="$(sed -n '/id="verdict"/,/<\/div>/p' "$dump" | head -12)"
              printf "::error::%sexpected '%s', title was '%s'\n%s\n" \
                "$page ${flags:+($flags) }" "$want" "${got:-<none>}" "$detail"
              return 1
            fi
          }
          export -f drive
          export chrome root

          # `|| true` so an empty list reaches the guard below rather than killing the step at
          # `set -e` with no message. Red either way; only one of the two says why.
          expected=$(printf '%s\n' "$checks" | grep -c '[^[:space:]]' || true)

          if [ "${expected:-0}" -eq 0 ]; then
            echo "::error::the proof checks list is empty, so this step would prove nothing."
            exit 1
          fi

          echo "Driving $expected checks, four at a time."

          # `-d '\n'` and not xargs's default splitting: these lines carry spaces and colons,
          # and the default would tear `STICKY: PASS` into two arguments. `-P 4` keeps going
          # after a page fails and exits 123 if any did, so every failing page is reported in
          # one run rather than only the first.
          set +e
          printf '%s\n' "$checks" | grep '[^[:space:]]' \
            | xargs -d '\n' -P 4 -n 1 bash -c 'drive "$1"' _ | tee /tmp/proof.log
          status=${PIPESTATUS[2]}
          set -e

          ok=$(grep -c '^  ok    ' /tmp/proof.log || true)

          # A page disagreeing with its expected verdict has already printed its own
          # `::error::` above, naming the page and the title it actually had. This says how
          # many, and is deliberately a separate sentence from the one below it: "a page is
          # wrong" and "no page ran" are different faults and used to share a message that
          # misdiagnosed the first as the second.
          if [ "$status" -ne 0 ]; then
            echo "::error::$((expected - ok)) of $expected proof checks did not reach the expected verdict."
            exit 1
          fi

          # **Positive control, and this step did not have one.** `xargs` over an empty list
          # exits 0 having run nothing, which is exactly what a mangled `checks` string would
          # produce and reads identically to twenty-one passes — this repository's oldest
          # failure shape. Counting the verdicts and requiring the expected number makes a list
          # that stopped matching a red build instead of a silence.
          if [ "${ok:-0}" -ne "$expected" ]; then
            echo "::error::only $ok of $expected proof checks ran; the list has stopped matching."
            exit 1
          fi

          echo "All $expected proof checks reached their expected verdict."

      - name: Compare screenshots against the visual-regression goldens
        # The nine checks above assert verdicts — sticky, narrow, motion, theme, shortcut,
        # insets — and none of them look at a pixel. Four palettes and three new screens were
        # being judged by eye. This is the tenth: it screenshots the same proof pages this job
        # already rendered and compares each against a committed golden with a small per-pixel
        # tolerance, via scripts/visual-regression.sh.
        #
        # **`ubuntu-latest` already has the real Chrome the goldens were made from**, so this
        # runs the script's native path with no Docker involved — the Docker fallback in that
        # script exists for a developer's own machine, not for here. `PP_PROOF_ALREADY_BUILT=1`
        # skips re-running the `dotnet test` above, which already wrote fresh proof pages.
        id: visual
        env:
          PP_PROOF_ALREADY_BUILT: "1"
        run: ./scripts/visual-regression.sh

      - name: Upload visual-regression diffs
        # Only reachable on a real pixel mismatch or a missing golden, per the step above's own
        # id — a `--out` diff PNG is written only when a page fails, but `actual/` is written on
        # every page either way, which is what makes this the place a CI-rendered capture can be
        # got hold of.
        #
        # **`include-hidden-files` is why this step had never once uploaded anything.** The path
        # is `.visual-regression/`, upload-artifact excludes dot-prefixed paths by default, and
        # `if-no-files-found` defaults to `warn` — so the step logged "No files were found with
        # the provided path" and went green, on every failing run, for as long as it has existed.
        # That is this repository's oldest failure shape (a check satisfied by there being
        # nothing to check) wearing a workflow step's clothes. `error` is set as well, so the
        # same thing cannot happen quietly a second time: if this step runs and finds nothing,
        # the run fails and says so.
        #
        # **Both of those are v7's defaults, not v4's remembered — re-read and then proved.**
        # The paragraph above described v4 and the pin is now `@v7`, which is exactly the dead
        # pointer this repository treats as worse than none: three majors landed in between
        # (v5 node24, v6 node24 by default, v7 ESM plus a new `archive` input), any of which
        # could have moved a default and left the comment explaining a hazard that was gone —
        # or, far worse, left the hazard in place while the comment read as history. `v7`'s own
        # `action.yml` still declares `include-hidden-files` with `default: 'false'` and
        # `if-no-files-found` with `default: 'warn'`, so the trap and both answers to it are
        # unchanged.
        #
        # **Read is not proved, and this comment is the reason to distrust reading.** On the
        # bump's own pull request a golden was deliberately corrupted so the comparison failed
        # and this step actually ran, beside a temporary twin identical to it but for the one
        # line under test. The twin — no `include-hidden-files`, same path, same
        # `if-no-files-found: error` — failed with "No files were found with the provided path:
        # .visual-regression/. No artifacts will be uploaded." in the same run in which this step
        # uploaded 9 files and 867,576 bytes: the eight captures under
        # `.visual-regression/actual/` and the one diff PNG for the single page whose golden was
        # corrupted. That is the v4 defect reproduced on v7, and this step not having it, from
        # one run rather than from two readings of a YAML file. The artifact was downloaded and
        # its file list read, because "the step said it uploaded" is the claim, not the proof.
        #
        # v7's new `archive` input is deliberately left at its default: it uploads a single file
        # unzipped and fails on a glob that resolves to more than one, and this path is a
        # directory.
        if: ${{ !cancelled() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: .visual-regression/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish the browser front end
        # The static site is the deliverable for web/, and publishing exercises things a
        # plain build does not — chiefly staging data/rules into wwwroot.
        #
        # **`EnableDefaultCompressionFormats=false` here and deliberately NOT in deploy.yml.**
        # `BrotliCompress` was 27.5 of this step's 51 seconds — measured with
        # `-clp:PerformanceSummary`, where it is the top task by an order of magnitude over the
        # C# compiler itself — producing 209 `.br` and 209 `.gz` sidecars, 49 MB of publish
        # output against 29 MB without them.
        #
        # **What this step exists to check cannot see one of those files.** The two steps below
        # it are the whole point of publishing on a pull request: that every `data/rules/*.json`
        # plus `index.html`, `_headers` and `_redirects` landed, and that
        # `write-cloudflare-headers.sh` can still find the inline import map to hash. Both were
        # run against an uncompressed publish before this line was written — twelve rules files,
        # all four required files, and the script writing `_headers` with its one script hash —
        # so this is a measurement rather than a reading of the SDK targets.
        #
        # **The deploy is a different question and is left alone on purpose.** Whether Cloudflare
        # Pages ever serves those sidecars, or merely stores them, is a claim about production
        # that nothing here has tested — and the way to answer it is against the live site, not
        # by assuming this step's answer generalises. Dropping them from the deploy would save
        # the same 27 seconds and a third of the upload; do it as its own change, with its own
        # proof.
        run: |
          dotnet publish web/ProwlersAndParagons.Web.csproj \
            --configuration Release -p:ContinuousIntegrationBuild=true \
            -p:EnableDefaultCompressionFormats=false -o publish

      - name: Write security headers
        # Run here as well as on deploy so a change that breaks the Content-Security-Policy
        # fails on the pull request rather than on the way to production. The script exits
        # non-zero if it cannot find the inline import map to hash.
        run: ./scripts/write-cloudflare-headers.sh publish/wwwroot

      - name: Check the published site is complete
        # Nothing else checks the served payload. The rules are fetched at runtime, so
        # their absence is a site that loads and then cannot start — invisible to a build.
        run: |
          missing=0
          for f in data/rules/*.json; do
            name=$(basename "$f")
            if [ ! -s "publish/wwwroot/data/rules/$name" ]; then
              echo "::error::$name is missing or empty in the published site."
              missing=1
            fi
          done
          for required in index.html _headers _redirects; do
            if [ ! -s "publish/wwwroot/$required" ]; then
              echo "::error::$required is missing or empty in the published site."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "Published site is complete."
          exit "$missing"

      - name: Read the wrangler version the deploy will use
        # **Split out of the step below so the cache after it can be keyed on the answer.**
        # `npx --yes wrangler@<version>` was eighteen seconds a run, nearly all of it fetching
        # a package whose version changes only when Dependabot bumps `deploy.yml`. A cache
        # cannot be keyed on a value computed inside the step that uses it, so the read happens
        # here and both the cache and the bundle read its output.
        id: wrangler
        run: |
          set -euo pipefail

          # Matches any major, not `@v3` literally: Dependabot bumps this pin, and a pattern tied
          # to one major would stop matching — which is what the fallback below used to hide.
          version=$(sed -n 's/^.*wrangler-action@v[0-9][0-9.]*.*# wrangler=\([0-9.]*\).*$/\1/p' .github/workflows/deploy.yml) || version=''

          # **This used to fall back to a hardcoded 3.90.0, and that fallback was the hazard.**
          # The step below says "same wrangler version as the deploy action, or the point is
          # lost" — and a fallback is precisely how the point gets lost quietly: the sed stops
          # matching, the step goes on bundling against a version the deploy no longer uses, and
          # everything is green. That is this repository's oldest failure shape again, so the
          # answer is the one it always is: fail, name the line, and make somebody look.
          # `WranglerIsPinnedToOneVersion` is the other half — it fails the suite when the three
          # places that name a wrangler version stop agreeing, so this is the belt to that brace.
          [ -n "$version" ] || {
            echo "::error::Could not read a wrangler version out of deploy.yml's"
            echo "::error::'uses: cloudflare/wrangler-action@…  # wrangler=<version>' line."
            echo "::error::Refusing to bundle against a guess — the whole point of that step is"
            echo "::error::that it uses the same wrangler the deploy will."
            exit 1
          }

          echo "deploy.yml pins wrangler@$version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the wrangler download
        # Keyed on the exact version and nothing else, so the entry is stable until Dependabot
        # moves the pin and is then replaced rather than accumulating. No `restore-keys`: a
        # near-miss here would be another version's tarballs, which buys nothing.
        #
        # **This caches the download, not the install.** `npx` still unpacks into a fresh
        # directory every run; what goes away is fetching ~30 MB from the registry.
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-wrangler-${{ steps.wrangler.outputs.version }}

      - name: The deploy would parse this
        # **The reason this step exists.** Wrangler's bundled esbuild is older than Node's, and
        # for one week that difference shipped through both suites and a whole-tree Qodana scan
        # to fail on the *deploy* — `import ... with { type: 'json' }` is Node-native and refused
        # by the bundler. Nothing before this step ran the same command the deploy runs.
        #
        # **`wrangler pages functions build`** is the closest thing wrangler has to a dry run for
        # Pages Functions: it walks `functions/` + everything it imports, bundles through the
        # same esbuild the deploy uses, and writes a compiled worker. It uploads nothing, so it
        # needs no credentials and is safe on `pull_request` — which the real deploy deliberately
        # never triggers on. `pages deploy --dry-run` **does not exist**; I tried it once, so
        # this comment names the mistake so nobody makes it a third time.
        #
        # Same wrangler version as the deploy action, or the point is lost.
        env:
          WRANGLER_VERSION: ${{ steps.wrangler.outputs.version }}
        run: |
          echo "Bundling the deploy with wrangler@$WRANGLER_VERSION, the same version as deploy.yml."

          # Write to a scratch directory so nothing lands in the tree the tests scan.
          out=$(mktemp -d)
          npx --yes wrangler@"$WRANGLER_VERSION" pages functions build \
            --outfile="$out/worker.js"

          # Positive control: something was actually written. Wrangler will happily report a
          # successful bundle of nothing at all if `functions/` walked into an empty tree.
          test -s "$out/worker.js" || {
            echo "::error::pages functions build produced no output — the bundler skipped everything."
            exit 1
          }
          echo "Bundled $(wc -c < "$out/worker.js") bytes."
