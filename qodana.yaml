#-------------------------------------------------------------------------------#
#           Qodana analysis is configured by qodana.yaml file                    #
#      https://www.jetbrains.com/help/qodana/qodana-yaml.html                    #
#-------------------------------------------------------------------------------#
version: "1.0"

# Qodana Community for .NET (ReSharper inspections). Verified working on this repo.
#
# Deliberately the *Community* linter (cdnet), not the release linter (dotnet).
#
# **A token is not enough — the release linter needs a valid Cloud licence, and a
# token alone breaks cdnet too.** This was tried: with a QODANA_TOKEN secret set,
# *both* images linked the Cloud project and then died before inspecting anything —
#
#   level=fatal msg="License request: token was declined by Qodana Cloud server
#   License verification failed."
#
# — so CI went red having analysed nothing. cdnet needs no token, no account and no
# licence, which is why it is what runs here, and why the workflow no longer passes
# a token through at all: a scan cannot be broken by a credential it never reads.
# See PR #38 for both runs.
#
# To upgrade you need three things together, and any two without the third break the
# scan: a Qodana Cloud plan that licenses the .NET linter, a QODANA_TOKEN secret, and
# an `env: QODANA_TOKEN:` back on the scan step — the workflow does not pass one now,
# and the secret has been deleted. Then change this one line to
# jetbrains/qodana-dotnet:2026.2. Nothing else moves: the path exclusions below and
# every severity in .editorconfig apply to both images.
# Expect a different count — cdnet's zero was measured on cdnet.
#
# There is no reason to do any of that for a one-developer repository. Community
# analyses everything and reports zero. If what you want is a dashboard rather than
# more inspections, making the repo public turns on the free GitHub code-scanning
# upload at the foot of the workflow by itself.
#
# Both images bundle .NET SDK 8.0, 9.0 and 10.0, so net10.0 analyses natively.
# Pinned rather than :latest so CI results stay reproducible.
linter: jetbrains/qodana-cdnet:2026.2

# qodana.recommended is the default profile; qodana.starter is a smaller subset.
profile:
  name: qodana.recommended

# Guarantee the SDK named in global.json is present before inspection.
# The bundled 10.0.x SDK already satisfies global.json's `rollForward: latestMinor`,
# so this is belt-and-braces for when global.json is bumped ahead of the image.
bootstrap: curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --jsonfile /data/project/global.json -i /usr/share/dotnet

# Without this, Qodana for .NET cannot locate the project and reports nothing.
dotnet:
  solution: ProwlersAndParagonsAutomation.sln
  configuration: Release

# Which *inspections* are off, and why, is in .editorconfig — not here.
#
# `exclude:` accepts an inspection name and appears to work, and does not: the .NET linter
# is ReSharper, which takes its severities from EditorConfig, so a named exclusion in this
# file is silently ignored and the finding still reports. Verified by running the scan
# both ways. Only the path exclusions below actually take effect.
exclude:
  # Generated character sheets and build output carry nothing worth inspecting.
  # web/wwwroot/data is the rules JSON the browser build stages there; data/rules is
  # the copy that actually lives in the repository.
  - name: All
    paths:
      - output
      - bin
      - obj
      - .qodana
      - web/wwwroot/data

